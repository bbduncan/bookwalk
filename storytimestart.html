<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Time</title>
  <style>
    body {
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #faf8f3;
    }
    .box {
      text-align: center;
      padding: 40px;
      max-width: 400px;
    }
    h1 { color: #2c3e6b; }
    p { color: #555; }
    input {
      font-size: 2rem;
      width: 80px;
      text-align: center;
      padding: 10px;
      border: 2px solid #2c3e6b;
      border-radius: 8px;
      margin: 20px 0;
    }
    button {
      display: block;
      width: 100%;
      padding: 15px;
      background: #2c3e6b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>📖 Story Time</h1>
    <p>How many are joining Story Time today?<br>(count grown-ups too!)</p>
    <input type="number" id="groupSize" min="1" max="50" value="1">
    <button id="go" onclick="submit()">Watch the Story!</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const libraryId = params.get('library');

    async function submit() {
      document.getElementById('go').disabled = true;
      const size = document.getElementById('groupSize').value;
      try {
        await fetch('/api/storytime-record?library=' + libraryId + '&size=' + size);
      } catch (e) {
        // Never block a kid from the story because logging hiccuped.
      }
      window.location.href = 'https://beckylduncan.com/storytimeod.html';
    }
  </script>
</body>
</html>
